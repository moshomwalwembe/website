<!doctype html>
<!--
  This is the development template used by Vite.
  **DO NOT UPLOAD THIS FILE TO GITHUB PAGES** – use the files
  generated under `dist/` after running `npm run build`.
  The production index.html (with correct asset paths) is found in
  `dist/index.html`.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/website/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mosho-portfolio</title>

    <!-- Tailwind CDN + custom theme (mirrors other site) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                red: '#D90429',
                darkRed: '#8D0000',
              },
              neutral: {
                black: '#0A0A0A',
                white: '#FFFFFF',
              },
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'grid-flow': 'gridFlow 20s linear infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              gridFlow: {
                '0%': { transform: 'translateY(0)' },
                '100%': { transform: 'translateY(50px)' },
              },
            },
          },
        },
      };
    </script>
    <script>
      // Default to dark mode if not explicitly saved as light
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0A0A0A;
        color: #FFFFFF;
        transition: background-color 0.25s ease, color 0.25s ease;
      }
      html.light body {
        background-color: #F8FAFC;
        color: #0F172A;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0A0A0A;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #D90429;
      }
    </style>

    <!-- include project styles (Vite will inject during dev/build too) -->
    <script type="module" crossorigin src="/website/assets/index-CpOr0vlC.js"></script>
    <link rel="stylesheet" crossorigin href="/website/assets/index-R5L_4RS3.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
